# Netlify config for the Rugby365 Next.js app (npm workspaces monorepo).
# Do not set publish — @netlify/plugin-nextjs owns the Next.js output.
# Keep Base directory unset (repo root). Package directory in UI: apps/web.

[build]
  command = "npm run build -w @rugby365/web"
  # Must differ from package directory (apps/web) or the Next plugin refuses to run.
  # The plugin still owns the real Next output; this only satisfies Netlify's path check.
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "22"
  # Ensure TypeScript and other build-time deps install on Netlify.
  NPM_FLAGS = "--include=dev"
  SITE_GATE_ENABLED = "false"
  # Avoid OOM on Netlify builders during Next compile.
  NODE_OPTIONS = "--max-old-space-size=6144"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Next plugin varies CDN cache on RSC keys only. Fixture APIs must vary on
# date/start/end/year or every day serves today's empty schedule. Competition
# APIs must vary on season/view or 1987 tables get the 2027 payload.
[[headers]]
  for = "/api/fixtures/*"
  [headers.values]
    Netlify-Vary = "query"

[[headers]]
  for = "/api/competitions/*"
  [headers.values]
    Netlify-Vary = "query"
